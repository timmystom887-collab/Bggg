<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Steel Plate Gradient -->
    <linearGradient id="steelPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Rust & Patina Accent -->
    <linearGradient id="plateRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="10%" stop-color="#475569"/>
      <stop offset="90%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Stamped Gold Lettering -->
    <linearGradient id="stampGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Twilight Ferris Wheel Sky -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="ferrisGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Bolt Gradient -->
    <radialGradient id="boltGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Skin Tone -->
    <linearGradient id="briggsSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54311c"/>
      <stop offset="50%" stop-color="#3d2110"/>
      <stop offset="100%" stop-color="#241208"/>
    </linearGradient>

    <!-- Shepherd Dark Coat -->
    <linearGradient id="shebaCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="40%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Industrial Steel Plate with Rounded Corners & Heavy Border -->
  <rect x="20" y="20" width="560" height="860" rx="36" fill="url(#steelPlate)" stroke="url(#plateRim)" stroke-width="12" filter="url(#badgeShadow)"/>
  <rect x="34" y="34" width="532" height="832" rx="26" fill="none" stroke="#475569" stroke-width="2" opacity="0.6"/>

  <!-- Four Heavy Corner Rivets/Bolts -->
  <g id="rivets">
    <!-- Top-Left -->
    <circle cx="55" cy="55" r="14" fill="url(#boltGrad)" stroke="#1e293b" stroke-width="2"/>
    <line x1="47" y1="55" x2="63" y2="55" stroke="#0f172a" stroke-width="3"/>
    <!-- Top-Right -->
    <circle cx="545" cy="55" r="14" fill="url(#boltGrad)" stroke="#1e293b" stroke-width="2"/>
    <line x1="537" y1="55" x2="553" y2="55" stroke="#0f172a" stroke-width="3"/>
    <!-- Bottom-Left -->
    <circle cx="55" cy="845" r="14" fill="url(#boltGrad)" stroke="#1e293b" stroke-width="2"/>
    <line x1="47" y1="845" x2="63" y2="845" stroke="#0f172a" stroke-width="3"/>
    <!-- Bottom-Right -->
    <circle cx="545" cy="845" r="14" fill="url(#boltGrad)" stroke="#1e293b" stroke-width="2"/>
    <line x1="537" y1="845" x2="553" y2="845" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- ==================== BACKGROUND SCENERY ==================== -->
  <g id="backgroundPier">
    <!-- Twilight Pier Silhouette Sky -->
    <path d="M45,45 L555,45 L555,640 L45,640 Z" fill="url(#twilightSky)"/>
    <circle cx="300" cy="200" r="220" fill="url(#ferrisGlow)"/>

    <!-- Ferris Wheel Silhouette in Background -->
    <g id="ferrisWheel" stroke="#475569" stroke-width="2" opacity="0.45" fill="none">
      <circle cx="270" cy="180" r="140"/>
      <circle cx="270" cy="180" r="100"/>
      <circle cx="270" cy="180" r="60"/>
      <circle cx="270" cy="180" r="15" fill="#334155"/>
      <!-- Wheel Spokes -->
      <line x1="270" y1="40" x2="270" y2="320"/>
      <line x1="130" y1="180" x2="410" y2="180"/>
      <line x1="171" y1="81" x2="369" y2="279"/>
      <line x1="369" y1="81" x2="171" y2="279"/>
      <line x1="200" y1="59" x2="340" y2="301"/>
      <line x1="340" y1="59" x2="200" y2="301"/>
      <!-- Wheel Support Legs -->
      <line x1="270" y1="180" x2="210" y2="360" stroke-width="4"/>
      <line x1="270" y1="180" x2="330" y2="360" stroke-width="4"/>
    </g>

    <!-- Distant Boardwalk Skyline Silhouettes -->
    <path d="M45,340 L110,320 L130,340 L210,310 L250,340 L380,330 L430,305 L470,340 L555,335 L555,640 L45,640 Z" fill="#090d16" opacity="0.8"/>
  </g>

  <!-- ==================== BRIGGS (OG VANGUARD) ==================== -->
  <g id="briggsCharacter">
    <!-- Studded Leather Biker Jacket Torso & Shoulders -->
    <path d="M70,640 L110,360 Q230,310 370,350 L430,640 Z" fill="#090c10"/>
    
    <!-- Leather Texture & Shading -->
    <path d="M110,360 Q200,325 320,330 L360,450 L270,480 L180,450 Z" fill="#171923" opacity="0.7"/>

    <!-- Silver Pyramid & Round Metal Studs on Lapels and Shoulders -->
    <g id="jacketStuds" fill="#cbd5e1" stroke="#334155" stroke-width="1">
      <!-- Left Shoulder Studs -->
      <circle cx="130" cy="380" r="5"/><circle cx="150" cy="370" r="5"/><circle cx="170" cy="365" r="5"/>
      <circle cx="120" cy="405" r="5"/><circle cx="140" cy="395" r="5"/><circle cx="160" cy="390" r="5"/>
      <circle cx="115" cy="430" r="5"/><circle cx="135" cy="420" r="5"/>
      <!-- Left Lapel Studs -->
      <polygon points="175,410 183,418 175,426 167,418"/>
      <polygon points="185,435 193,443 185,451 177,443"/>
      <polygon points="195,460 203,468 195,476 187,468"/>
      <polygon points="205,485 213,493 205,501 197,493"/>
      <!-- Chest Tactical Patches -->
      <circle cx="145" cy="470" r="16" fill="#7f1d1d" stroke="#fef08a" stroke-width="1.5"/>
      <text x="145" y="474" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="900">K9</text>
      
      <rect x="115" y="500" width="34" height="20" rx="3" fill="#1e293b" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="132" y="513" font-family="'JetBrains Mono', monospace" font-size="7" fill="#facc15" text-anchor="middle" font-weight="800">OG</text>

      <!-- Center Zipper -->
      <line x1="260" y1="440" x2="260" y2="640" stroke="#94a3b8" stroke-width="5" stroke-dasharray="4,2"/>
    </g>

    <!-- Strong Neck -->
    <path d="M210,380 L210,260 Q260,275 310,260 L310,380 Z" fill="url(#briggsSkin)"/>
    <path d="M210,270 Q260,310 310,270 L310,290 Q260,330 210,290 Z" fill="#180b04" opacity="0.6"/>

    <!-- Head & Chiseled Jaw (Briggs - Samuel L. Jackson Persona) -->
    <path d="M190,190 C185,270 215,310 260,310 C305,310 335,270 330,190 C330,120 190,120 190,190 Z" fill="url(#briggsSkin)"/>
    <!-- Intense Brow & Facial Shading -->
    <path d="M220,165 Q260,175 300,165" stroke="#180b04" stroke-width="4" fill="none"/>
    <path d="M225,185 Q260,192 295,185" stroke="#180b04" stroke-width="3" fill="none"/>

    <!-- Sharp Intense Eyes with Unflinching Gaze -->
    <ellipse cx="232" cy="180" rx="9" ry="6" fill="#ffffff"/>
    <circle cx="233" cy="180" r="4.5" fill="#3d2110"/>
    <circle cx="233" cy="180" r="2" fill="#000000"/>
    <circle cx="234" cy="179" r="1" fill="#ffffff"/> <!-- catchlight -->

    <ellipse cx="288" cy="180" rx="9" ry="6" fill="#ffffff"/>
    <circle cx="287" cy="180" r="4.5" fill="#3d2110"/>
    <circle cx="287" cy="180" r="2" fill="#000000"/>
    <circle cx="288" cy="179" r="1" fill="#ffffff"/>

    <!-- Furrowed Forehead Creases -->
    <path d="M245,150 Q260,154 275,150" stroke="#241208" stroke-width="2" fill="none"/>
    <path d="M240,158 Q260,162 280,158" stroke="#241208" stroke-width="2" fill="none"/>

    <!-- Nose & Mustache -->
    <path d="M255,180 L250,215 L270,215 Z" fill="#241208" opacity="0.6"/>
    <!-- Sculpted Mustache -->
    <path d="M242,235 Q260,228 278,235 Q260,242 242,235 Z" fill="#090a0f"/>
    <!-- Firm Jaw & Goatee -->
    <path d="M248,252 Q260,254 272,252" stroke="#180b04" stroke-width="3" fill="none"/>
    <path d="M245,260 Q260,270 275,260 L270,275 Q260,282 250,275 Z" fill="#090a0f"/>

    <!-- Tactical Black Baseball Cap (True Cap) with Arch Horseshoe Logo -->
    <path d="M190,140 Q260,80 330,140 Q310,100 260,95 Q210,100 190,140 Z" fill="#090c10"/>
    <!-- Cap Crown -->
    <ellipse cx="260" cy="120" rx="65" ry="35" fill="#171923"/>
    <!-- Curved Cap Visor / Brim -->
    <path d="M185,135 Q260,115 335,135 L345,148 Q260,130 175,148 Z" fill="#090c10" stroke="#334155" stroke-width="1.5"/>
    
    <!-- White Arch / Horseshoe Cap Insignia -->
    <path d="M240,122 C240,105 280,105 280,122" fill="none" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="237" y1="125" x2="243" y2="125" stroke="#f8fafc" stroke-width="3"/>
    <line x1="277" y1="125" x2="283" y2="125" stroke="#f8fafc" stroke-width="3"/>
    <text x="260" y="104" font-family="'JetBrains Mono', monospace" font-size="6" fill="#f8fafc" text-anchor="middle" font-weight="900" letter-spacing="1">UNIT</text>
  </g>

  <!-- ==================== SHEBA (PROTECTIVE SNARLING K9) ==================== -->
  <g id="shebaCharacter">
    <!-- Powerful Muscular Torso -->
    <path d="M300,640 Q330,480 390,440 Q470,410 540,510 L550,640 Z" fill="url(#shebaCoat)"/>

    <!-- Heavy Leather Spiked Collar (Dog Allisnt / Briggade Unit) -->
    <path d="M335,465 Q415,440 480,485 L470,515 Q410,470 325,495 Z" fill="#020617" stroke="#475569" stroke-width="2"/>
    <!-- Metal Spikes (Cone Studs) -->
    <polygon points="340,465 330,440 350,460" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
    <polygon points="370,455 365,425 382,452" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
    <polygon points="405,450 405,420 420,448" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
    <polygon points="440,455 448,425 455,455" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
    <polygon points="470,470 485,445 480,475" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>

    <!-- Shepherd Head & Snarling Snout -->
    <!-- Left Ear (Upright, Alert, Razor-Form) -->
    <polygon points="360,340 340,160 415,260" fill="#090c10" stroke="#1e293b" stroke-width="3"/>
    <polygon points="362,310 350,200 398,270" fill="#581c1c" opacity="0.6"/>

    <!-- Right Ear -->
    <polygon points="445,330 485,180 475,280" fill="#090c10" stroke="#1e293b" stroke-width="3"/>
    <polygon points="448,310 475,210 468,280" fill="#581c1c" opacity="0.6"/>

    <!-- Head Crown -->
    <ellipse cx="410,310" rx="55" ry="50" fill="url(#shebaCoat)"/>

    <!-- Snarl Wrinkles on Muzzle Ridge -->
    <path d="M370,300 Q350,335 325,355 L385,385 Q410,335 405,295 Z" fill="#090c10"/>
    <path d="M355,320 Q365,315 375,325" stroke="#475569" stroke-width="2.5" fill="none"/>
    <path d="M345,335 Q360,330 370,340" stroke="#475569" stroke-width="2.5" fill="none"/>

    <!-- Snarling Open Mouth / Bared Fangs (Protective Stance) -->
    <path d="M340,360 L285,395 Q310,435 365,410 L380,370 Z" fill="#450a0a"/>
    <!-- Dark Pink Tongue -->
    <path d="M315,410 Q335,390 350,405 Q335,425 315,410 Z" fill="#e11d48"/>

    <!-- Razor-Sharp White Fangs (Upper & Lower Canines) -->
    <!-- Upper Main Canine -->
    <polygon points="305,378 295,402 312,384" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <!-- Upper Incisors -->
    <polygon points="314,375 310,390 320,380" fill="#ffffff"/>
    <polygon points="322,373 319,387 328,377" fill="#ffffff"/>
    <!-- Lower Canine -->
    <polygon points="310,412 302,392 318,405" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

    <!-- Textured Leather Nose -->
    <ellipse cx="290,382" rx="12" ry="9" fill="#000000"/>
    <circle cx="288" cy="379" r="2" fill="#64748b"/>

    <!-- Glowing Amber Eye (Vicious, Intelligent Focus) -->
    <ellipse cx="380,290" rx="9" ry="6" fill="#fbbf24"/>
    <circle cx="380" cy="290" r="3.5" fill="#000000"/>
    <circle cx="382" cy="288" r="1.5" fill="#ffffff"/>
  </g>

  <!-- ==================== STAMPED GOLD TITLING ==================== -->
  <g id="stampedBranding" transform="translate(0, 680)">
    <!-- Plate Separator Line -->
    <line x1="60" y1="10" x2="540" y2="10" stroke="#334155" stroke-width="3"/>
    <line x1="60" y1="12" x2="540" y2="12" stroke="#000000" stroke-width="2"/>

    <!-- Main Title: BRIGGADE -->
    <text x="300" y="85" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="82" letter-spacing="12" fill="url(#stampGold)" text-anchor="middle">
      BRIGGADE
    </text>

    <!-- Subtitle: UNIT: SHEBA & BRIGGS -->
    <text x="300" y="135" font-family="'JetBrains Mono', 'Impact', monospace" font-weight="800" font-size="28" letter-spacing="6" fill="#cbd5e1" text-anchor="middle">
      UNIT: SHEBA &amp; BRIGGS
    </text>
  </g>
</svg>
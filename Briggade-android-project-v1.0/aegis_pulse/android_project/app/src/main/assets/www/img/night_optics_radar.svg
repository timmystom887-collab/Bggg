<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- NVG Circular Vignette (Phosphor Green Lens) -->
    <radialGradient id="nvgPhosphor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="85%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#021a0c"/>
    </radialGradient>

    <!-- Thermal Heat Glow Filter -->
    <filter id="thermalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Black Background Screen -->
  <rect x="0" y="0" width="600" height="900" fill="#020617"/>

  <!-- Top Stencil Header: NIGHT OPTICS: SHEBA ACQUIRING TARGET -->
  <text x="300" y="65" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="20" letter-spacing="2" fill="#4ade80" text-anchor="middle">
    NIGHT OPTICS: SHEBA ACQUIRING TARGET
  </text>

  <!-- ==================== CIRCULAR NIGHT-VISION OPTICS TUBE ==================== -->
  <g id="nvgCircleScope" transform="translate(50, 100)">
    <!-- Lens Tube Border -->
    <circle cx="250" cy="340" r="240" fill="url(#nvgPhosphor)" stroke="#16a34a" stroke-width="6"/>
    <!-- Stadia / Range Reticle Lines -->
    <circle cx="250" cy="340" r="200" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3" stroke-dasharray="10,6"/>
    <circle cx="250" cy="340" r="120" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3" stroke-dasharray="8,6"/>
    <line x1="250" y1="110" x2="250" y2="570" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="340" x2="480" y2="340" stroke="#22c55e" stroke-width="1" opacity="0.4"/>

    <!-- Boardwalk Planks Perspective Lines -->
    <line x1="160" y1="560" x2="230" y2="360" stroke="#15803d" stroke-width="2" opacity="0.5"/>
    <line x1="340" y1="560" x2="270" y2="360" stroke="#15803d" stroke-width="2" opacity="0.5"/>
    <line x1="70" y1="500" x2="430" y2="500" stroke="#15803d" stroke-width="1.5" opacity="0.4"/>
    <line x1="110" y1="440" x2="390" y2="440" stroke="#15803d" stroke-width="1.5" opacity="0.4"/>
    <line x1="150" y1="390" x2="350" y2="390" stroke="#15803d" stroke-width="1.5" opacity="0.4"/>

    <!-- Ferris Wheel Silhouette in Green Glow -->
    <g stroke="#22c55e" stroke-width="2" opacity="0.5" fill="none" transform="translate(140, 140)">
      <circle cx="160" cy="100" r="80"/>
      <circle cx="160" cy="100" r="50"/>
      <line x1="160" y1="20" x2="160" y2="180"/>
      <line x1="80" y1="100" x2="240" y2="100"/>
      <line x1="103" y1="43" x2="217" y2="157"/>
      <line x1="217" y1="43" x2="103" y2="157"/>
      <line x1="160" y1="100" x2="130" y2="200" stroke-width="3"/>
      <line x1="160" y1="100" x2="190" y2="200" stroke-width="3"/>
    </g>

    <!-- Distant Targets (Suspect Heat Signatures) -->
    <g id="distantTargets" fill="#86efac" opacity="0.85">
      <ellipse cx="140" cy="350" rx="3" ry="8"/>
      <ellipse cx="150" cy="345" rx="3.5" ry="10"/>
      <!-- Target Marker Reticle Box -->
      <rect x="132" y="330" width="26" height="30" fill="none" stroke="#4ade80" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Foreground: Glowing Thermal Heat Signatures (Briggs & Sheba) -->
    <g id="foregroundUnits" filter="url(#thermalGlow)">
      <!-- Briggs Heat Silhouette -->
      <path d="M260,320 Q285,310 300,320 L315,360 L320,440 L305,480 L295,430 L275,430 L270,480 L255,440 L255,360 Z" fill="#4ade80"/>
      <circle cx="282" cy="305" r="14" fill="#4ade80"/>
      <!-- Halyard Spear held upright -->
      <line x1="320" y1="270" x2="320" y2="460" stroke="#86efac" stroke-width="3"/>

      <!-- Sheba (Black Shepherd) Heat Silhouette (Alert at Left) -->
      <path d="M225,440 Q235,370 250,360 Q265,370 265,420 L260,460 L220,460 Z" fill="#4ade80"/>
      <!-- Head and Pointed Ears -->
      <polygon points="230,360 225,335 240,350" fill="#4ade80"/>
      <polygon points="245,355 255,340 252,360" fill="#4ade80"/>
      <ellipse cx="238" cy="360" rx="14" ry="12" fill="#4ade80"/>
    </g>
  </g>

  <!-- Bottom Banner: BRIGGADE: PERIMETER SECURE -->
  <text x="300" y="820" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="26" letter-spacing="4" fill="#4ade80" text-anchor="middle">
    BRIGGADE: PERIMETER SECURE
  </text>
</svg>